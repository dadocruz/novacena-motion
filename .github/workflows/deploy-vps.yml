name: Deploy to VPS

on:
  push:
    branches:
      - feat/render-cloud-lambda
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}
  SERVICE: novacena-motion

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_NOVACENA_SAAS_MODE=1
            NEXT_PUBLIC_GTM_ID=${{ vars.NEXT_PUBLIC_GTM_ID || 'GTM-P4RX9S2X' }}
            NEXT_PUBLIC_WHATSAPP_PHONE=${{ vars.NEXT_PUBLIC_WHATSAPP_PHONE || '5519993941536' }}
            NEXT_PUBLIC_WHATSAPP_MESSAGE=${{ vars.NEXT_PUBLIC_WHATSAPP_MESSAGE || 'Olá! Vim pelo site NovaCena Motion e tenho interesse em criar motions para lançamentos musicais. Origem: site_motion_google_ads' }}

      - name: Deploy to VPS
        id: deploy1
        continue-on-error: true
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: IMAGE,SERVICE
          # Conexão SSH a partir do runner às vezes demora pra estabelecer —
          # timeout maior evita o "dial tcp i/o timeout" intermitente que
          # fazia o deploy falhar com o build OK.
          timeout: 90s
          command_timeout: 15m
          script: |
            set -e
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER || github.actor }}" --password-stdin
            else
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi

            IMAGE_TAG="${IMAGE}:${{ github.sha }}"
            PREVIOUS_IMAGE="$(docker service inspect "${SERVICE}" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null || true)"

            echo "Pulling ${IMAGE_TAG}..."
            docker pull "${IMAGE_TAG}"

            echo "Updating service ${SERVICE}..."
            docker service update \
              --with-registry-auth \
              --label-add traefik.swarm.network=automatizadoria \
              --image "${IMAGE_TAG}" \
              "${SERVICE}"

            echo "Waiting for container to be healthy..."
            HEALTHY=false
            for i in $(seq 1 12); do
              sleep 10
              CID=$(docker ps -q --filter "name=${SERVICE}" --filter "health=healthy" 2>/dev/null | head -1)
              if [ -n "$CID" ]; then
                HEALTHY=true
                break
              fi
              echo "  attempt $i/12 — not healthy yet"
            done

            echo "--- Service status ---"
            docker service ps "${SERVICE}" \
              --format "table {{.Name}}\t{{.CurrentState}}\t{{.Error}}" \
              --filter "desired-state=running"

            if [ "$HEALTHY" = true ]; then
              echo "Healthcheck OK (container $CID)"
            else
              echo "WARNING: no healthy container after 120s"
              docker service logs "${SERVICE}" --tail 20 --no-trunc 2>&1 | tail -15
              if [ -n "${PREVIOUS_IMAGE}" ]; then
                echo "Rolling back to ${PREVIOUS_IMAGE}..."
                docker service update --with-registry-auth --image "${PREVIOUS_IMAGE}" "${SERVICE}" || true
              fi
              exit 1
            fi

      # 2ª tentativa automática: o passo acima usa continue-on-error, então se
      # ele falhar (tipicamente "dial tcp i/o timeout" do SSH, com a imagem já
      # no GHCR), esta tentativa roda de novo. Se ESTA falhar, o job falha.
      - name: Deploy to VPS (retry após timeout de SSH)
        if: steps.deploy1.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: IMAGE,SERVICE
          timeout: 120s
          command_timeout: 15m
          script: |
            set -e
            if [ -n "${{ secrets.GHCR_TOKEN }}" ]; then
              echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER || github.actor }}" --password-stdin
            else
              echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi

            IMAGE_TAG="${IMAGE}:${{ github.sha }}"
            PREVIOUS_IMAGE="$(docker service inspect "${SERVICE}" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}' 2>/dev/null || true)"

            echo "Pulling ${IMAGE_TAG}..."
            docker pull "${IMAGE_TAG}"

            echo "Updating service ${SERVICE}..."
            docker service update \
              --with-registry-auth \
              --label-add traefik.swarm.network=automatizadoria \
              --image "${IMAGE_TAG}" \
              "${SERVICE}"

            echo "Waiting for container to be healthy..."
            HEALTHY=false
            for i in $(seq 1 12); do
              sleep 10
              CID=$(docker ps -q --filter "name=${SERVICE}" --filter "health=healthy" 2>/dev/null | head -1)
              if [ -n "$CID" ]; then
                HEALTHY=true
                break
              fi
              echo "  attempt $i/12 — not healthy yet"
            done

            echo "--- Service status ---"
            docker service ps "${SERVICE}" \
              --format "table {{.Name}}\t{{.CurrentState}}\t{{.Error}}" \
              --filter "desired-state=running"

            if [ "$HEALTHY" = true ]; then
              echo "Healthcheck OK (container $CID)"
            else
              echo "WARNING: no healthy container after 120s"
              docker service logs "${SERVICE}" --tail 20 --no-trunc 2>&1 | tail -15
              if [ -n "${PREVIOUS_IMAGE}" ]; then
                echo "Rolling back to ${PREVIOUS_IMAGE}..."
                docker service update --with-registry-auth --image "${PREVIOUS_IMAGE}" "${SERVICE}" || true
              fi
              exit 1
            fi
